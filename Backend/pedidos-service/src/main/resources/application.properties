spring.application.name=pedidos-service

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pedidos360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion OAuth2 / JWT para Azure AD
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/bb5324af-c266-41ed-b36c-a971641c7af2/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/discovery/keys

logging.level.org.springframework.security=DEBUG
# =====================================
# CONFIGURACION DE RABBITMQ
# =====================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Confirmaciones manuales RabbitMQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false