spring.application.name=pedidos-service

spring.datasource.url=jdbc:mysql://pedidos360-db.c7jnbg6qhwmp.us-east-1.rds.amazonaws.com:3306/pedidos360?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Configuración OAuth2 / JWT para Azure AD
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/{TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/{TENANT_ID}/discovery/v2.0/keys